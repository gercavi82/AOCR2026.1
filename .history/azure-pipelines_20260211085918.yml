# Pipeline CI/CD para AOCR
# Ejecuta: restore, build, test y genera artefactos

trigger:
  branches:
    include:
      - main
      - develop
      - hotfix/*
      - release/*

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  # DB variables used by migration steps - set DB_PASSWORD as a secret in pipeline variables or variable group
  DB_HOST: '172.20.16.55'
  DB_PORT: '5432'
  DB_NAME: 'dgac_des'
  DB_USER: 'root'
  DB_PASSWORD: ''

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Build Solution'
        steps:
          # Restaurar NuGet
          - task: NuGetToolInstaller@1
            displayName: 'Install NuGet'

          - task: NuGetCommand@2
            displayName: 'NuGet Restore'
            inputs:
              restoreSolution: '$(solution)'

          # Compilar
          - task: VSBuild@1
            displayName: 'Build Solution'
            inputs:
              solution: '$(solution)'
              msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)\\"'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          # Ejecutar Tests
          - task: VSTest@2
            displayName: 'Run Unit Tests'
            inputs:
              testSelector: 'testAssemblies'
              testAssemblyVer2: |
                **\*Tests.dll
                !**\*TestAdapter.dll
                !**\obj\**
              searchFolder: '$(System.DefaultWorkingDirectory)'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'
              codeCoverageEnabled: true

          # Publicar resultados de tests
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              mergeTestResults: true

          # Publicar artefactos
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: DeployDev
    displayName: 'Deploy to DEV'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to DEV Environment'
        environment: 'AOCR-DEV'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - checkout: self
                  displayName: 'Checkout repository to obtain migration scripts'

                - task: PowerShell@2
                  displayName: 'Run DB migrations (FASE1 RT) - Dev'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "Running AOCR RT migration script..."
                      $scriptPath = "$(Build.SourcesDirectory)\\scripts\\sql\\migrate_20260211_aocr_rt_fase1.sql"
                      if (-not (Test-Path $scriptPath)) { Write-Error "Migration script not found: $scriptPath"; exit 1 }
                      $pgHost = '$(DB_HOST)'
                      $pgPort = '$(DB_PORT)'
                      $pgDb = '$(DB_NAME)'
                      $pgUser = '$(DB_USER)'
                      $pgPassword = '$(DB_PASSWORD)'

                      # Ensure psql is available (install minimal client via choco if necessary)
                      $psql = Get-Command psql -ErrorAction SilentlyContinue
                      if (-not $psql) {
                          Write-Host "psql not found. Installing postgresql client via choco (may take a while)..."
                          choco install postgresql --yes || (Write-Error 'Failed to install postgresql via choco'; exit 1)
                      }

                      $env:PGPASSWORD = $pgPassword
                      & psql -h $pgHost -p $pgPort -U $pgUser -d $pgDb -f $scriptPath
                      if ($LASTEXITCODE -ne 0) { Write-Error "psql reported error (exit code $LASTEXITCODE)"; exit $LASTEXITCODE }

                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Deploy to IIS'
                  inputs:
                    WebSiteName: 'AOCR-DEV'
                    Package: '$(System.ArtifactsDirectory)/drop/*.zip'
                    TakeAppOfflineFlag: true

  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        displayName: 'Deploy to QA Environment'
        environment: 'AOCR-QA'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - checkout: self
                  displayName: 'Checkout repository to obtain migration scripts'

                - task: PowerShell@2
                  displayName: 'Run DB migrations (FASE1 RT) - QA'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "Running AOCR RT migration script (QA)..."
                      $scriptPath = "$(Build.SourcesDirectory)\\scripts\\sql\\migrate_20260211_aocr_rt_fase1.sql"
                      if (-not (Test-Path $scriptPath)) { Write-Error "Migration script not found: $scriptPath"; exit 1 }
                      $pgHost = '$(DB_HOST)'
                      $pgPort = '$(DB_PORT)'
                      $pgDb = '$(DB_NAME)'
                      $pgUser = '$(DB_USER)'
                      $pgPassword = '$(DB_PASSWORD)'

                      $psql = Get-Command psql -ErrorAction SilentlyContinue
                      if (-not $psql) {
                          Write-Host "psql not found. Installing postgresql client via choco (may take a while)..."
                          choco install postgresql --yes || (Write-Error 'Failed to install postgresql via choco'; exit 1)
                      }

                      $env:PGPASSWORD = $pgPassword
                      & psql -h $pgHost -p $pgPort -U $pgUser -d $pgDb -f $scriptPath
                      if ($LASTEXITCODE -ne 0) { Write-Error "psql reported error (exit code $LASTEXITCODE)"; exit $LASTEXITCODE }

                - script: echo "Deployment to QA requires manual approval"
                  displayName: 'QA Deployment Placeholder'
